    <script>
        function changeImage() {
            var image = document.getElementById("myImage");
            var caption = document.getElementById("imageName");


            if (image.src.match("Cartagena")) {
                image.src = "Images/Medellin.jpg";
                caption.innerHTML = "Medellin City";
            } else {
                image.src = "Images/Cartagena.png";
                caption.innerHTML = "Cartagena City";
            }
        }
    </script>
</head>

<body>

<div class="container">

<h1>WHAT CITY IN COLOMBIA SHOULD I VISIT NEXT?</h1>

<div class="card">

<h2>Click the image to see my Options</h2>

<img id="myImage" src="Images/Cartagena.png" onclick="changeImage()" alt="Cartagena">
<h3 id="imageName" class="caption">Cartagena City</h3>

</div>

</div>
